version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter:
    sdk: flutter
  wanim:
    path: ..

dev_dependencies:
