name: Wanim Preview
options:
  bundleIdPrefix: dev.remotion
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Wanim:
    path: ../wanim-swift
targets:
  Wanim Preview:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Wanim
    settings:
      base:
        PRODUCT_NAME: Wanim Preview
        PRODUCT_BUNDLE_IDENTIFIER: dev.remotion.wanim-preview
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES
